server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Always revalidate so browsers get the newest build after a redeploy.
    # (Responses still benefit from conditional requests / 304s via ETag.)
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
